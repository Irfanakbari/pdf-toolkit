name: pdf-toolkit

x-app: &app
  image: ${API_IMAGE:?Set API_IMAGE to an immutable GHCR tag or digest}
  env_file:
    - path: .env.production
      required: false
  environment:
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the external PostgreSQL database}
    REDIS_URL: redis://redis:6379/0
    STORAGE_ROOT: /storage
    HOME: /home/app
    TMPDIR: /tmp/libreoffice
  volumes:
    - type: bind
      source: ${NAS_HOST_PATH:?Set NAS_HOST_PATH}
      target: /storage
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=1g,uid=1000,gid=1000,mode=1777
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7.4.5-alpine@sha256:0302cccee2b2043e61b497c8f4075467c5f7ba27a9f38be7e092634f2734baed
    command: [redis-server, --appendonly, "yes", --maxmemory, 384mb, --maxmemory-policy, noeviction]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    cpus: 0.5

  migrate:
    <<: *app
    command: [alembic, upgrade, head]
    restart: "no"
    mem_limit: 512m
    cpus: 0.5

  api:
    <<: *app
    ports:
      - "0.0.0.0:${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    cpus: 0.75

  worker-pdf:
    <<: *app
    command: [dramatiq, pdf_toolkit.tasks, --queues, pdf, --processes, "2", --threads, "1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    mem_limit: 3g
    cpus: 2.0

  worker-office:
    <<: *app
    command: [dramatiq, pdf_toolkit.tasks, --queues, office, --processes, "1", --threads, "1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 1.0

  cleanup:
    <<: *app
    command: [python, -m, pdf_toolkit.cleanup]
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.25

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to an immutable GHCR tag or digest}
    env_file:
      - path: .env.production
        required: false
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "0.0.0.0:${WEB_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,uid=1001,gid=1001,mode=1777
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5

volumes:
  redis_data:
