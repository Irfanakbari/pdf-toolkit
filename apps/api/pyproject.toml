[project]
name = "pdf-toolkit-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "sqlalchemy[asyncio]>=2.0.40,<3",
  "asyncpg>=0.30,<1", "alembic>=1.16,<2", "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1", "python-magic>=0.4.27,<1; sys_platform != 'win32'",
  "python-magic-bin>=0.4.14,<1; sys_platform == 'win32'", "dramatiq[redis]>=1.18,<2",
  "redis>=5,<7", "pikepdf>=9,<11", "img2pdf>=0.6,<1", "Pillow>=11,<13", "PyMuPDF>=1.26,<2",
  "pdf2docx>=0.5.8,<1", "pdfplumber>=0.11.0,<1", "openpyxl>=3.1.2,<4", "python-pptx>=1.0.0,<2"
]
[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/pdf_toolkit"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP042"]
